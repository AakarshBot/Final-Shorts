name: build-windows-raqm-pillow

on:
  pull_request:
    paths:
      - ".github/workflows/build-windows-raqm-pillow.yml"
      - "renderer.py"
      - "Run_Final_Shorts.bat"
      - "tests/test_renderer.py"
      - "fonts/NotoSansDevanagari-Bold.ttf"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows-raqm-pillow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-raqm-wheel:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: python-pillow/Pillow
          ref: 11.3.0
          path: pillow-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: pillow-source/winbuild/depends
          key: pillow-winbuild-11.3.0-amd64-raqm-v1
      - name: Prepare upstream Pillow dependency build
        working-directory: pillow-source
        shell: pwsh
        run: python winbuild/build_prepare.py -v --architecture AMD64 --depends winbuild/depends --no-imagequant --no-avif
      - name: Build Pillow with vendored RAQM and FriBiDi
        working-directory: pillow-source
        shell: cmd
        run: |
          call winbuild\build\build_dep_all.cmd
          if errorlevel 1 exit /b 1
          call winbuild\build\build_env.cmd
          if errorlevel 1 exit /b 1
          python -m pip install --upgrade pip wheel setuptools delvewheel
          if errorlevel 1 exit /b 1
          if not exist "%GITHUB_WORKSPACE%\raqm-wheel-raw" mkdir "%GITHUB_WORKSPACE%\raqm-wheel-raw"
          if not exist "%GITHUB_WORKSPACE%\raqm-wheels" mkdir "%GITHUB_WORKSPACE%\raqm-wheels"
          python -m pip wheel -v --no-deps --no-build-isolation -C raqm=enable -C raqm=vendor -C fribidi=vendor --wheel-dir "%GITHUB_WORKSPACE%\raqm-wheel-raw" .
          if errorlevel 1 exit /b 1
          delvewheel repair --add-path "%GITHUB_WORKSPACE%\pillow-source\winbuild\build\bin" --wheel-dir "%GITHUB_WORKSPACE%\raqm-wheels" "%GITHUB_WORKSPACE%\raqm-wheel-raw\pillow-11.3.0-cp311-cp311-win_amd64.whl"
          if errorlevel 1 exit /b 1
      - name: Verify extracted wheel in an isolated runtime with Hindi and Telugu fonts
        shell: pwsh
        run: |
          $verify = @'
          import os
          import sys
          import zipfile
          import subprocess
          import shutil
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          wheel = root / "raqm-wheels" / "pillow-11.3.0-cp311-cp311-win_amd64.whl"
          test_target = root / "raqm-test"
          if test_target.exists():
              shutil.rmtree(test_target)
          test_target.mkdir()
          with zipfile.ZipFile(wheel) as archive:
              archive.extractall(test_target)

          probe_code = "\n".join((
              "import os, sys",
              f"root = {str(root)!r}",
              f"target = {str(test_target)!r}",
              "dll_dirs = [os.path.join(target, 'PIL'), os.path.join(target, 'pillow.libs'), os.path.join(target, 'PIL', '.libs')]",
              "handles = [os.add_dll_directory(p) for p in dll_dirs if os.name == 'nt' and os.path.isdir(p)]",
              "sys.path.insert(0, target)",
              "import PIL",
              "from PIL import ImageFont, features",
              "import PIL._imagingft as imagingft",
              "raqm = features.check_feature('raqm')",
              "assert raqm is True, f'Pillow was not compiled with RAQM (PIL={PIL.__file__}; _imagingft={imagingft.__file__}; RAQM={raqm})'",
              "samples = [('NotoSansDevanagari-Bold.ttf', 'क्षेत्र की उपलब्धि'), ('NotoSansTelugu-Bold.ttf', 'ప్రత్యేకమైన క్రీడాకారుడు')]",
              "for font_name, sample in samples:",
              "    font = ImageFont.truetype(os.path.join(root, 'fonts', font_name), 48, layout_engine=ImageFont.Layout.RAQM)",
              "    assert font.getmask(sample).getbbox() is not None, f'Indic glyph shaping returned an empty mask for {font_name}'",
          ))
          probe_env = os.environ.copy()
          for variable in ("PYTHONPATH", "PYTHONHOME", "PYTHONUSERBASE"):
              probe_env.pop(variable, None)
          system_root = Path(probe_env.get("SystemRoot", "C:/Windows"))
          runtime_paths = (
              test_target / "PIL",
              test_target / "pillow.libs",
              test_target / "PIL" / ".libs",
              Path(sys.executable).resolve().parent,
              system_root / "System32",
              system_root,
          )
          probe_env["PATH"] = os.pathsep.join(str(path) for path in runtime_paths if path.is_dir())
          probe = subprocess.run(
              [sys.executable, "-I", "-S", "-c", probe_code],
              capture_output=True,
              text=True,
              encoding="utf-8",
              errors="replace",
              timeout=45,
              check=False,
              env=probe_env,
          )
          if probe.returncode != 0:
              raise SystemExit(
                  "The extracted RAQM-enabled Pillow wheel failed isolated runtime verification.\n"
                  + (probe.stdout or "")
                  + (probe.stderr or "")
              )
          print("Verified: isolated wheel has RAQM and both Devanagari and Telugu font shaping succeeds.")
          '@
          $verifyPath = Join-Path $env:GITHUB_WORKSPACE "verify-raqm-wheel.py"
          Set-Content -Path $verifyPath -Value $verify -Encoding utf8
          python $verifyPath
          if ($LASTEXITCODE -ne 0) { throw "The isolated custom Pillow wheel failed RAQM/Indic verification." }
          $wheel = Get-Item "$env:GITHUB_WORKSPACE\\raqm-wheels\\pillow-11.3.0-cp311-cp311-win_amd64.whl"
          $sha256 = (Get-FileHash -Path $wheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  $($wheel.Name)" | Set-Content -Path "$($wheel.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: raqm-pillow-windows-py311
          path: |
            raqm-wheels/pillow-11.3.0-cp311-cp311-win_amd64.whl
            raqm-wheels/pillow-11.3.0-cp311-cp311-win_amd64.whl.sha256
          if-no-files-found: error
          retention-days: 7

  publish-raqm-wheel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-raqm-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raqm-pillow-windows-py311
          path: raqm-release
      - name: Publish verified runtime wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="raqm-pillow-windows-v1"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Final-Shorts RAQM-enabled Pillow for Windows" \
              --notes "Custom Pillow 11.3.0 CPython 3.11 x64 wheel built from the upstream Pillow 11.3.0 source using the documented vendored RAQM and FriBiDi options. The wheel and its SHA-256 sidecar are produced and checked by the Windows build workflow." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" \
            raqm-release/pillow-11.3.0-cp311-cp311-win_amd64.whl \
            raqm-release/pillow-11.3.0-cp311-cp311-win_amd64.whl.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
