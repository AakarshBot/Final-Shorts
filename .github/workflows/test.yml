name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py topic_fetcher.py script_writer.py audio.py visual_fetcher.py visual_search.py visual_generator.py renderer.py subtitles.py uploader.py
      - run: python -m pytest -q
